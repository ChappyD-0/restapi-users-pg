<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios - REST API (Postgres)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f0f4f8;
    }

    .navbar {
      background-color: #6c5ce7 !important;
    }

    .navbar-brand {
      font-weight: bold;
    }

    .badge.bg-info {
      background-color: #00cec9 !important;
    }

    .card {
      border-radius: 16px !important;
      border: none !important;
    }

    .card-title {
      font-weight: 600;
    }

    .border-warning {
      border-left: 5px solid #fdcb6e !important;
    }

    .border-danger {
      border-left: 5px solid #d63031 !important;
    }

    .btn-warning {
      background-color: #fab1a0 !important;
      color: #2d3436;
      border: none;
    }

    .btn-secondary {
      background-color: #b2bec3 !important;
      border: none;
    }

    .btn-info {
      background-color: #74b9ff !important;
      color: white;
      border: none;
    }

    .btn:hover {
      opacity: 0.9;
    }

    input.form-control {
      border-radius: 8px;
      border: 1px solid #ced4da;
    }

    table thead {
      background-color: #ffeaa7;
    }

    table tbody tr:hover {
      background-color: #f1f2f6;
    }

    table {
      border-radius: 8px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        Gestión de Usuarios
        <span class="badge bg-info ms-2">Postgres</span>
      </a>
    </div>
  </nav>

  <div class="container">
    <!-- Formulario de creación/edición -->
    <div class="card mb-4 shadow-sm border-warning">
      <div class="card-body">
        <h5 class="card-title text-warning">Crear / Editar Usuario</h5>
        <form id="userForm" class="row g-3">
          <input type="hidden" id="userId">
          <div class="col-md-6">
            <label for="name" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="name" placeholder="Nombre" required>
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
          </div>
          <div class="col-md-4">
            <label for="age" class="form-label">Edad</label>
            <input type="number" class="form-control" id="age" placeholder="30" required>
          </div>
          <div class="col-md-8">
            <label for="comments" class="form-label">Comentarios</label>
            <input type="text" class="form-control" id="comments" placeholder="Comentarios adicionales">
          </div>
          <div class="col-12 text-end">
            <button type="submit" class="btn btn-warning" id="saveBtn">Enviar</button>
            <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display:none;">Cancelar</button>
            <button type="button" id="loadUsersBtn" class="btn btn-info ms-2">Cargar Usuarios</button>
          </div>
        </form>
        <div id="resultMessage" class="mt-3"></div>
      </div>
    </div>

    <!-- Tabla de usuarios -->
    <div class="card shadow-sm border-danger">
      <div class="card-body">
        <h5 class="card-title text-danger">Listado de Usuarios</h5>
        <table class="table table-hover" id="usersTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Edad</th>
              <th>Comentarios</th>
              <th>Creado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- Filas generadas dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS y Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./callrestapi.js"></script>
</body>
</html>
